<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Em breve">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f7f5f0">
<title>Em construção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --azul:#0f3d7a; --azul2:#1b56a6; --azul-claro:#e8eef8;
  --fundo:#f4f6fa; --cartao:#fff; --texto:#1a2433; --suave:#5b6778;
  --borda:#dde3ec; --erro:#b3261e; --ok:#1e7a46;
  --raio:16px; --sombra:0 2px 10px rgba(15,61,122,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--fundo);color:var(--texto);
  -webkit-font-smoothing:antialiased;min-height:100svh}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- FACHADA ---------- */
#ecraFachada{min-height:100svh;display:flex;flex-direction:column;background:#f7f5f0;color:#6b6b6b}
.fach-centro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.fach-icone{font-size:44px;margin-bottom:18px;opacity:.8}
.fach-centro h1{font-weight:600;font-size:22px;color:#3a3a3a;margin-bottom:10px}
.fach-centro p{font-size:15px;line-height:1.6}
.fach-rodape{text-align:center;padding:18px 0 calc(env(safe-area-inset-bottom) + 18px);font-size:12px;color:#aaa}
#segredo{padding:10px 16px;cursor:default;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#ecraLogin .voltar{display:block;text-align:center;margin-top:10px;font-size:13px;color:var(--suave);text-decoration:none}

/* ---------- LOGIN ---------- */
#ecraLogin{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(160deg,var(--azul) 0%,var(--azul2) 100%)}
.login-card{background:#fff;width:100%;max-width:380px;border-radius:20px;padding:32px 26px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.login-card .brasao{width:56px;height:56px;border-radius:14px;background:var(--azul);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px}
.login-card h1{font-family:'Playfair Display',serif;color:var(--azul);text-align:center;font-size:26px}
.login-card p.sub{text-align:center;color:var(--suave);font-size:14px;margin:6px 0 24px}
label{display:block;font-size:13px;font-weight:600;color:var(--suave);margin:12px 0 6px}
input[type=email],input[type=password],input[type=text],input[type=url],input[type=number],select,textarea{
  width:100%;padding:12px 14px;border:1px solid var(--borda);border-radius:12px;background:#fff;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--azul2);outline-offset:0;border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;
  padding:12px 18px;font-weight:600;cursor:pointer;font-size:15px;-webkit-tap-highlight-color:transparent}
.btn-primario{background:var(--azul);color:#fff;width:100%;margin-top:20px}
.btn-primario:active{background:var(--azul2)}
.btn-sec{background:var(--azul-claro);color:var(--azul)}
.btn-perigo{background:#fbe9e7;color:var(--erro)}
.btn:disabled{opacity:.6}
.msg{font-size:14px;margin-top:14px;text-align:center;min-height:20px}
.msg.erro{color:var(--erro)} .msg.ok{color:var(--ok)}
.versao{text-align:center;color:#9aa5b5;font-size:11px;margin-top:18px}

/* ---------- PORTAL ---------- */
header{position:sticky;top:0;z-index:10;background:var(--azul);color:#fff;
  padding:calc(env(safe-area-inset-top) + 14px) 18px 14px}
.topo{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
.topo h2{font-family:'Playfair Display',serif;font-size:21px;flex:1;line-height:1.1}
.topo h2 small{display:block;font-family:Inter;font-weight:400;font-size:12px;opacity:.8;margin-top:2px}
.icon-btn{background:rgba(255,255,255,.14);border:0;color:#fff;width:40px;height:40px;border-radius:12px;
  font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-btn.ativo{background:#fff;color:var(--azul)}
main{max-width:1100px;margin:0 auto;padding:18px 16px calc(env(safe-area-inset-bottom) + 40px)}
.pesquisa{position:relative;margin-bottom:18px}
.pesquisa input{padding-left:42px}
.pesquisa span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--suave)}
.categoria{margin:22px 0 10px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
.grelha{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media(min-width:700px){.grelha{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}}
.app{position:relative;background:var(--cartao);border-radius:var(--raio);padding:16px;box-shadow:var(--sombra);
  text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:10px;min-height:132px;
  border:1px solid transparent;transition:transform .12s, border-color .12s;-webkit-tap-highlight-color:transparent}
.app:active{transform:scale(.97)}
@media(hover:hover){.app:hover{border-color:var(--azul2);transform:translateY(-2px)}}
.app .ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff}
.app .nome{font-weight:700;font-size:15px;line-height:1.25}
.app .desc{font-size:12.5px;color:var(--suave);line-height:1.35}
.app.sem-link{opacity:.55}
.app .aviso{font-size:11px;color:var(--erro);font-weight:600}
.app .editar{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:10px;border:0;
  background:var(--azul-claro);color:var(--azul);font-size:15px;cursor:pointer}
.vazio{text-align:center;color:var(--suave);padding:40px 10px;font-size:15px}
.add-card{border:2px dashed var(--borda);background:transparent;box-shadow:none;align-items:center;justify-content:center;
  color:var(--azul);font-weight:600;cursor:pointer}

/* ---------- MODAL ---------- */
.fundo-modal{position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:100;display:flex;align-items:flex-end;
  justify-content:center;overscroll-behavior:contain}
@media(min-width:700px){.fundo-modal{align-items:center}}
.modal{background:#fff;width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;border-radius:20px 20px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 22px)}
@media(min-width:700px){.modal{border-radius:20px}}
.modal h3{font-size:18px;color:var(--azul);margin-bottom:6px}
.modal .acoes{display:flex;gap:10px;margin-top:22px}
.modal .acoes .btn{flex:1}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cores{display:flex;flex-wrap:wrap;gap:8px}
.cores button{width:34px;height:34px;border-radius:10px;border:3px solid transparent;cursor:pointer}
.cores button.sel{border-color:var(--texto)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);
  background:var(--texto);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:200;
  box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<section id="ecraFachada">
  <div class="fach-centro">
    <div class="fach-icone">🚧</div>
    <h1>Página em construção</h1>
    <p>Estamos a preparar algo novo.<br>Volte em breve.</p>
  </div>
  <footer class="fach-rodape"><span id="segredo">© 2026</span></footer>
</section>

<section id="ecraLogin" class="hidden">
  <form class="login-card" id="formLogin" autocomplete="on">
    <div class="brasao">🔑</div>
    <h1>Entrar</h1>
    <p class="sub">&nbsp;</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="pass">Palavra-passe</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button class="btn btn-primario" id="btnEntrar" type="submit">Entrar</button>
    <div class="msg" id="msgLogin"></div>
    <div style="text-align:center;margin-top:6px">
      <a href="#" id="lnkRecuperar" style="font-size:13px;color:var(--azul2)">Esqueci-me da palavra-passe</a>
    </div>
    <a href="#" class="voltar" id="lnkVoltar">← voltar</a>
    <div class="versao" id="versaoLogin"></div>
  </form>
</section>

<!-- ================= PORTAL ================= -->
<section id="ecraPortal" class="hidden">
  <header>
    <div class="topo">
      <h2>Atalhos<small id="utilizadorEmail"></small></h2>
      <button class="icon-btn" id="btnGerir" title="Gerir links">✏️</button>
      <button class="icon-btn" id="btnSair" title="Sair">⎋</button>
    </div>
  </header>
  <main>
    <div class="pesquisa">
      <span>🔍</span>
      <input type="text" id="pesquisa" placeholder="Procurar aplicação…" autocomplete="off">
    </div>
    <div id="lista"></div>
  </main>
</section>

<div id="modalRaiz"></div>

<script>
/* =========================================================
   CONFIGURAÇÃO — colocar aqui os dados do projeto Supabase
   ========================================================= */
const SUPABASE_URL  = 'https://SEU-PROJETO.supabase.co';
const SUPABASE_ANON = 'COLOCAR_AQUI_A_ANON_KEY';
const APP_VERSAO    = 'V1.0';

const CORES = ['#0f3d7a','#1b56a6','#0e7c86','#1e7a46','#7a5c0f','#b3541e','#a3203a','#6a3fa0','#3d4a5c'];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
  auth: { persistSession: true, autoRefreshToken: true, storageKey: 'pg-sess' }
});

let apps = [];
let modoGerir = false;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

$('versaoLogin').textContent = APP_VERSAO;

/* ---------- ENTRADA SECRETA ----------
   5 toques seguidos no "© 2026" do rodapé (em menos de 3 s)
   ou abrir o endereço com #acesso no fim               */
let toques = 0, tempoToques = null;
$('segredo').addEventListener('click', () => {
  toques++;
  clearTimeout(tempoToques);
  tempoToques = setTimeout(() => toques = 0, 3000);
  if (toques >= 5){ toques = 0; mostrarLogin(); }
});
$('lnkVoltar').addEventListener('click', e => { e.preventDefault(); mostrarFachada(); });
function mostrarLogin(){
  $('ecraFachada').classList.add('hidden');
  $('ecraPortal').classList.add('hidden');
  $('ecraLogin').classList.remove('hidden');
  setTimeout(() => $('email').focus(), 50);
}
function mostrarFachada(){
  $('ecraLogin').classList.add('hidden');
  $('ecraPortal').classList.add('hidden');
  $('ecraFachada').classList.remove('hidden');
  $('msgLogin').textContent = '';
}
if (location.hash === '#acesso'){
  history.replaceState(null, '', location.pathname);
  mostrarLogin();
}

/* ---------- utilitários de UI (sem alert/confirm — iOS) ---------- */
function toast(txt, ms = 2600){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = txt;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}
function abrirModal(html){
  $('modalRaiz').innerHTML = `<div class="fundo-modal" id="fundoModal"><div class="modal">${html}</div></div>`;
  document.body.style.overflow = 'hidden';
  $('fundoModal').addEventListener('click', e => { if (e.target.id === 'fundoModal') fecharModal(); });
}
function fecharModal(){
  $('modalRaiz').innerHTML = '';
  document.body.style.overflow = '';
}
function confirmar(texto, txtOk = 'Confirmar'){
  return new Promise(res => {
    abrirModal(`<h3>Confirmar</h3><p style="color:var(--suave);margin-top:8px">${esc(texto)}</p>
      <div class="acoes"><button class="btn btn-sec" id="cNao">Cancelar</button>
      <button class="btn btn-perigo" id="cSim">${esc(txtOk)}</button></div>`);
    $('cNao').onclick = () => { fecharModal(); res(false); };
    $('cSim').onclick = () => { fecharModal(); res(true); };
  });
}

/* ---------- AUTENTICAÇÃO ---------- */
$('formLogin').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('btnEntrar'), msg = $('msgLogin');
  btn.disabled = true; btn.textContent = 'A entrar…'; msg.textContent = ''; msg.className = 'msg';
  const { error } = await sb.auth.signInWithPassword({
    email: $('email').value.trim(), password: $('pass').value
  });
  btn.disabled = false; btn.textContent = 'Entrar';
  if (error){
    msg.className = 'msg erro';
    msg.textContent = error.message.includes('Invalid') ? 'Email ou palavra-passe incorretos.' : error.message;
  }
});

$('lnkRecuperar').addEventListener('click', async e => {
  e.preventDefault();
  const email = $('email').value.trim(), msg = $('msgLogin');
  if (!email){ msg.className = 'msg erro'; msg.textContent = 'Escreve primeiro o teu email.'; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  msg.className = error ? 'msg erro' : 'msg ok';
  msg.textContent = error ? error.message : 'Enviámos um email para redefinir a palavra-passe.';
});

$('btnSair').addEventListener('click', async () => {
  if (await confirmar('Terminar sessão no portal?', 'Sair')) await sb.auth.signOut();
});

sb.auth.onAuthStateChange((evento, sessao) => {
  if (evento === 'PASSWORD_RECOVERY'){ mostrarNovaPass(); return; }
  if (sessao) entrarPortal(sessao.user); else sairPortal();
});

function mostrarNovaPass(){
  abrirModal(`<h3>Nova palavra-passe</h3>
    <label>Nova palavra-passe</label><input type="password" id="np1" autocomplete="new-password">
    <label>Repetir</label><input type="password" id="np2" autocomplete="new-password">
    <div class="acoes"><button class="btn btn-primario" style="margin:0" id="npOk">Guardar</button></div>`);
  $('npOk').onclick = async () => {
    const a = $('np1').value, b = $('np2').value;
    if (a.length < 6) return toast('Mínimo 6 caracteres.');
    if (a !== b) return toast('As palavras-passe não coincidem.');
    const { error } = await sb.auth.updateUser({ password: a });
    if (error) return toast(error.message);
    fecharModal(); toast('Palavra-passe alterada.');
  };
}

function entrarPortal(user){
  $('ecraLogin').classList.add('hidden');
  $('ecraFachada').classList.add('hidden');
  $('ecraPortal').classList.remove('hidden');
  $('utilizadorEmail').textContent = user.email;
  carregarApps();
}
function sairPortal(){
  mostrarFachada();
  $('pass').value = '';
  apps = []; modoGerir = false; $('btnGerir').classList.remove('ativo');
}

/* ---------- DADOS ---------- */
async function carregarApps(){
  const { data, error } = await sb.from('portal_apps').select('*')
    .order('categoria', { ascending: true }).order('ordem', { ascending: true }).order('nome', { ascending: true });
  if (error){ $('lista').innerHTML = `<div class="vazio">Erro ao carregar: ${esc(error.message)}</div>`; return; }
  apps = data || [];
  render();
}

/* ---------- RENDER ---------- */
$('pesquisa').addEventListener('input', render);
$('btnGerir').addEventListener('click', () => {
  modoGerir = !modoGerir;
  $('btnGerir').classList.toggle('ativo', modoGerir);
  toast(modoGerir ? 'Modo de edição: toca em ✎ para alterar' : 'Modo de edição desligado', 1800);
  render();
});

function render(){
  const q = $('pesquisa').value.trim().toLowerCase();
  const filtradas = apps.filter(a => !q ||
    [a.nome, a.descricao, a.categoria].some(v => (v || '').toLowerCase().includes(q)));

  if (!filtradas.length && !modoGerir){
    $('lista').innerHTML = `<div class="vazio">${q ? 'Nenhuma aplicação encontrada.' : 'Ainda não há aplicações. Toca em ✏️ para adicionar.'}</div>`;
    return;
  }
  const grupos = {};
  filtradas.forEach(a => { const c = a.categoria || 'Outras'; (grupos[c] = grupos[c] || []).push(a); });

  let html = '';
  Object.keys(grupos).forEach(cat => {
    html += `<div class="categoria">${esc(cat)}</div><div class="grelha">`;
    grupos[cat].forEach(a => html += cartao(a));
    html += `</div>`;
  });
  if (modoGerir){
    html += `<div class="categoria">&nbsp;</div><div class="grelha">
      <button class="app add-card" id="btnAdd"><span style="font-size:28px">＋</span>Nova aplicação</button></div>`;
  }
  $('lista').innerHTML = html;

  document.querySelectorAll('[data-editar]').forEach(b => b.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    editarApp(apps.find(x => x.id === b.dataset.editar));
  }));
  if ($('btnAdd')) $('btnAdd').onclick = () => editarApp(null);
}

function cartao(a){
  const temLink = !!(a.url && a.url.trim());
  const inner = `
    <div class="ic" style="background:${esc(a.cor || CORES[0])}">${esc(a.icone || '📱')}</div>
    <div class="nome">${esc(a.nome)}</div>
    ${a.descricao ? `<div class="desc">${esc(a.descricao)}</div>` : ''}
    ${!temLink ? `<div class="aviso">Link por definir</div>` : ''}
    ${modoGerir ? `<button class="editar" data-editar="${a.id}" aria-label="Editar">✎</button>` : ''}`;
  if (temLink && !modoGerir){
    return `<a class="app" href="${esc(a.url)}" target="_blank" rel="noopener">${inner}</a>`;
  }
  return `<div class="app ${temLink ? '' : 'sem-link'}">${inner}</div>`;
}

/* ---------- EDITAR / CRIAR ---------- */
function editarApp(a){
  const novo = !a;
  a = a || { nome:'', url:'', descricao:'', icone:'📱', cor:CORES[0], categoria:'', ordem:0 };
  const cats = [...new Set(apps.map(x => x.categoria).filter(Boolean))];
  let corSel = a.cor || CORES[0];

  abrirModal(`<h3>${novo ? 'Nova aplicação' : 'Editar aplicação'}</h3>
    <label>Nome *</label><input type="text" id="fNome" value="${esc(a.nome)}">
    <label>Link (URL) *</label><input type="url" id="fUrl" inputmode="url" placeholder="https://…" value="${esc(a.url)}">
    <label>Descrição</label><input type="text" id="fDesc" value="${esc(a.descricao)}">
    <label>Categoria</label><input type="text" id="fCat" list="listaCats" value="${esc(a.categoria)}" placeholder="ex.: UASE, UDAJ, Pessoal">
    <datalist id="listaCats">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <div class="linha2">
      <div><label>Ícone (emoji)</label><input type="text" id="fIcone" maxlength="4" value="${esc(a.icone)}"></div>
      <div><label>Ordem</label><input type="number" id="fOrdem" inputmode="numeric" value="${Number(a.ordem) || 0}"></div>
    </div>
    <label>Cor</label>
    <div class="cores" id="fCores">${CORES.map(c => `<button type="button" data-cor="${c}" style="background:${c}" class="${c === corSel ? 'sel' : ''}"></button>`).join('')}</div>
    <div class="acoes">
      ${novo ? '' : `<button class="btn btn-perigo" id="fApagar">Apagar</button>`}
      <button class="btn btn-sec" id="fCancelar">Cancelar</button>
      <button class="btn btn-primario" style="margin:0" id="fGuardar">Guardar</button>
    </div>`);

  document.querySelectorAll('#fCores button').forEach(b => b.onclick = () => {
    corSel = b.dataset.cor;
    document.querySelectorAll('#fCores button').forEach(x => x.classList.toggle('sel', x === b));
  });
  $('fCancelar').onclick = fecharModal;

  $('fGuardar').onclick = async () => {
    const reg = {
      nome: $('fNome').value.trim(),
      url: normalizarUrl($('fUrl').value.trim()),
      descricao: $('fDesc').value.trim() || null,
      categoria: $('fCat').value.trim() || null,
      icone: $('fIcone').value.trim() || '📱',
      ordem: parseInt($('fOrdem').value, 10) || 0,
      cor: corSel
    };
    if (!reg.nome) return toast('Indica o nome.');
    const btn = $('fGuardar'); btn.disabled = true;
    const { error } = novo
      ? await sb.from('portal_apps').insert(reg)
      : await sb.from('portal_apps').update(reg).eq('id', a.id);
    btn.disabled = false;
    if (error) return toast('Erro: ' + error.message);
    fecharModal(); toast('Guardado.'); carregarApps();
  };

  if (!novo) $('fApagar').onclick = async () => {
    if (!(await confirmar(`Apagar "${a.nome}" do portal?`, 'Apagar'))) return;
    const { error } = await sb.from('portal_apps').delete().eq('id', a.id);
    if (error) return toast('Erro: ' + error.message);
    toast('Apagado.'); carregarApps();
  };
}

function normalizarUrl(u){
  if (!u) return '';
  return /^https?:\/\//i.test(u) ? u : 'https://' + u;
}
</script>
</body>
</html>
